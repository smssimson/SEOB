name: S:ARCH Browser QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/qa-ui.mjs'
      - '.github/workflows/browser-qa.yml'
      - 'sarch-workspace-v142.css'
      - 'sarch-workspace-v142.js'
      - 'sarch-layout-v135.js'
      - 'sarch-layout-v135.css'
      - 'recovery-v92.js'
      - 'survey/index.html'
      - 'drawing/index.html'
      - 'schmidt/index.html'
      - 'tilt/index.html'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sarch-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/version.json >/dev/null && break
            sleep 1
          done
      - name: Test desktop and tablet layouts
        run: node tools/qa-ui.mjs
      - name: Publish screenshots and browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarch-browser-test
          path: test-results/browser/
          if-no-files-found: ignore
