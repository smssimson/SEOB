name: SMETRIC deploy and ZIP cleanup

on:
  push:
    branches: [main]
    paths:
      - 'SEOB_survey_v*.zip'
      - 'SEOB_drawing_v*.zip'
      - 'survey-update-*.zip'
      - 'drawing-update-*.zip'
      - 'site-update-*.zip'
      - '현장조사.v*.zip'
      - '도면작성.v*.zip'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: seob-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply newest package for each app and remove uploaded ZIPs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import re, subprocess, shutil

          root = Path.cwd()
          patterns = {
            'survey': ('SEOB_survey_v*.zip', 'survey-update-*.zip', '현장조사.v*.zip'),
            'drawing': ('SEOB_drawing_v*.zip', 'drawing-update-*.zip', '도면작성.v*.zip'),
            'site': ('site-update-*.zip',),
          }
          def git_time(path):
            result = subprocess.run(['git','log','-1','--format=%ct','--',path.name],
                                    capture_output=True, text=True, check=True)
            return int(result.stdout.strip() or 0)
          def priority(path):
            match = re.search(r'(?:v|\.v)(\d+)(?=\D|$)', path.stem, re.I)
            return (int(match.group(1)) if match else -1, git_time(path), path.name)

          all_packages = []
          for kind, globs in patterns.items():
            packages = sorted({p for glob in globs for p in root.glob(glob)}, key=priority)
            if not packages:
              continue
            newest = packages[-1]
            print(f'[{kind}] Applying newest: {newest.name}; skipping {len(packages)-1} older ZIP(s)')
            with ZipFile(newest) as archive:
              entries = [e for e in archive.infolist() if not e.is_dir()]
              paths = [PurePosixPath(e.filename.replace('\\', '/')) for e in entries]
              heads = {p.parts[0] for p in paths if p.parts}
              strip = len(heads) == 1 and all(len(p.parts) > 1 for p in paths)
              for entry, path in zip(entries, paths):
                if path.is_absolute() or any(part in ('', '.', '..') for part in path.parts):
                  raise ValueError(f'Unsafe ZIP path: {entry.filename}')
                if entry.external_attr >> 16 & 0o170000 == 0o120000:
                  raise ValueError(f'Symlink not allowed: {entry.filename}')
                parts = list(path.parts[1:] if strip else path.parts)
                if not parts:
                  continue
                if parts[0] in ('.git', '.github'):
                  raise ValueError(f'Forbidden ZIP path: {entry.filename}')
                if kind in ('survey','drawing') and parts[0] == kind:
                  parts.pop(0)
                if not parts:
                  continue
                dest = root.joinpath(*(([kind] if kind != 'site' else []) + parts))
                if dest.resolve() == root.resolve() or root.resolve() not in dest.resolve().parents:
                  raise ValueError(f'Invalid destination: {entry.filename}')
                dest.parent.mkdir(parents=True, exist_ok=True)
                with archive.open(entry) as source, dest.open('wb') as target:
                  shutil.copyfileobj(source, target)
            all_packages.extend(packages)

          for package in all_packages:
            package.unlink()
            print('Removed ZIP from working tree:', package.name)
          print('SMETRIC files synchronized. Other files and app data untouched.')
          PY

      - name: Save updated app files to GitHub
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Deploy SMETRIC apps and clean uploaded ZIP files [skip ci]'
            for attempt in 1 2 3 4 5; do
  if git push origin HEAD:main; then
    echo "업데이트 저장 성공"
    break
  fi

  if [ "$attempt" -eq 5 ]; then
    echo "5회 재시도 후 저장 실패"
    exit 1
  fi

  git fetch origin main
  git rebase origin/main || {
    git rebase --abort
    echo "파일 충돌 발생: 수동 확인 필요"
    exit 1
  }

  sleep 3
done
          else
            echo 'No repository changes to save.'
          fi

      - name: Prepare published site
        shell: bash
        run: |
          mkdir -p _seob_public
          for item in * .[^.]*; do
            [ -e "$item" ] || continue
            case "$item" in .git|.github|_seob_public|*.zip) continue;; esac
            cp -a "$item" _seob_public/
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _seob_public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
