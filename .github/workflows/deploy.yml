name: SMETRIC deploy and ZIP cleanup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: smetric-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply uploaded packages and safely commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Always start from the latest remote main, never overwrite concurrent changes.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          import re, shutil, sys, tempfile

          root = Path('.')
          mapping = {
              'SEOB_survey_v': 'survey',
              'SEOB_drawing_v': 'drawing',
              'SEOB_schmidt_v': 'schmidt',
              'SEOB_equipment_v': 'schmidt',
              'SEOB_tilt_v': 'tilt',
          }
          candidates = {}
          for f in root.glob('*.zip'):
              name = f.name
              match = re.fullmatch(r'(SEOB_(?:survey|drawing|schmidt|equipment|tilt)_v)(\d+)\.zip', name, re.I)
              if match:
                  prefix, version = match.group(1), int(match.group(2))
                  target = mapping.get(prefix)
                  if target:
                      candidates.setdefault(target, []).append((version, f))
              elif name.startswith('site-update-') and name.endswith('.zip'):
                  candidates.setdefault('site', []).append((0, f))

          if not candidates:
              print('No update packages; keeping existing apps unchanged.')
              sys.exit(0)

          def safe_extract(zf, dest):
              for info in zf.infolist():
                  path = Path(info.filename)
                  if path.is_absolute() or '..' in path.parts or info.filename.startswith('\\'):
                      raise ValueError(f'Unsafe archive path: {info.filename}')
                  if info.is_dir():
                      continue
                  out = dest / path
                  out.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(info) as src, out.open('wb') as dst:
                      shutil.copyfileobj(src, dst)

          def copy_content(src, dst):
              dst.mkdir(parents=True, exist_ok=True)
              for f in src.rglob('*'):
                  if f.is_file():
                      target = dst / f.relative_to(src)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(f, target)

          # Verify ALL packages before modifying repository files.
          selected = {}
          for target, items in candidates.items():
              if target == 'site':
                  # Site archives have no standardized version; choose newest numbered vN, then name.
                  def site_key(item):
                      f = item[1]
                      m = re.search(r'v(\d+)', f.name, re.I)
                      return (int(m.group(1)) if m else 0, f.name)
                  selected[target] = max(items, key=site_key)[1]
              else:
                  selected[target] = max(items, key=lambda x: (x[0], x[1].name))[1]
          with tempfile.TemporaryDirectory() as td:
              staged = {}
              for target, archive in selected.items():
                  d = Path(td) / target
                  d.mkdir()
                  with ZipFile(archive) as zf:
                      bad = zf.testzip()
                      if bad:
                          raise ValueError(f'Corrupt file in {archive}: {bad}')
                      safe_extract(zf, d)
                  staged[target] = d
              for target, source in staged.items():
                  # Flatten archives with one enclosing directory when appropriate.
                  children = list(source.iterdir())
                  if (len(children) == 1 and children[0].is_dir() and children[0].name not in {'survey','drawing','schmidt','tilt','.github'} and not (source/'index.html').exists()):
                      source = children[0]
                  if target == 'site':
                      # Site update archives may include root index, icons, and app directories.
                      # Merge, never wipe existing apps.
                      copy_content(source, root)
                  else:
                      copy_content(source, root / target)
                  print(f'Applied {selected[target]} -> {target}')
              # Remove recognized uploaded ZIPs only AFTER all selected archives validated and applied.
              for items in candidates.values():
                  for _, archive in items:
                      archive.unlink()
                      print(f'Removed uploaded archive: {archive}')
          PY
            git add -A
            if git diff --cached --quiet; then
              echo 'No repository changes to commit.'
              break
            fi
            git commit -m 'Deploy SMETRIC apps and clean uploaded ZIP files [skip ci]'
            if git push origin HEAD:main; then
              echo 'Changes saved successfully.'
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'Push failed after five attempts; refusing to force-push.' >&2
              exit 1
            fi
            echo "Remote branch changed; retrying safely ($attempt/5)."
            sleep 3
          done

      - name: Prepare published site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='*.zip' ./ _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
