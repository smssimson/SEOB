name: Publish SARCH direct Android APK
on:
  push:
    branches: [native-app-v195]
    paths: ['.github/workflows/sarch-apk-download.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.ref == 'refs/heads/native-app-v195'
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve verified successful Android test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 44680775019 --repo "$GITHUB_REPOSITORY" --name SARCH-v195-Brand-Android-test --dir apk
          test -s apk/SARCH-v195-Brand-test.apk
          unzip -tq apk/SARCH-v195-Brand-test.apk
          mv apk/SARCH-v195-Brand-test.apk apk/SARCH.apk
      - name: Publish standalone APK (no ZIP or login required)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=sarch-v195-android-test
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" apk/SARCH.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" apk/SARCH.apk --repo "$GITHUB_REPOSITORY" --target b45782b86c96e81c0d368d7dba021944ca5b5c8a --title "S:ARCH v195 Android test" --notes "Android test APK, new brand design. Native OTA not yet available. Back up existing site data before testing." --prerelease
          fi
