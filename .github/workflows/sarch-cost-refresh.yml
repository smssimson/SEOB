name: SARCH indicative repair cost sources
on:
  schedule:
    - cron: "17 1 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sarch-cost-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official document reader dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pypdf
      - name: Check latest Korean Construction Association wage bulletins
        run: python scripts/update_sarch_costs.py
      - name: Commit only validated new wage data
        run: |
          if ! git diff --quiet -- survey/cost-data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add survey/cost-data.json
            git commit -m "chore(survey): verified latest official CAK wage bulletin"
            git push
          fi
      - name: Flag new official periods that require manual review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '^REVIEW_NEEDED' cost-update-status.txt; then
            YEAR=$(date -u +%Y)
            TITLE="S:ARCH 건설공사 단가 자동갱신 확인 필요 (${YEAR}년)"
            FOUND=$(gh issue list --state open --json title --jq ".[] | select(.title == \"$TITLE\") | .title" | head -n 1)
            if [ -z "$FOUND" ]; then
              printf '%s\n\n' "자동으로 수치 인증에 성공하지 못했습니다. 추정 금액은 표시 가능하지만 최신 공식 단가가 아닙니다." > /tmp/sarch-rate-issue.txt
              cat cost-update-status.txt >> /tmp/sarch-rate-issue.txt
              printf '\n출처: https://www.cak.or.kr/lay1/bbs/S1T41C42/A/14/list.do\n' >> /tmp/sarch-rate-issue.txt
              gh issue create --title "$TITLE" --body-file /tmp/sarch-rate-issue.txt
            fi
          fi
