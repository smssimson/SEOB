name: Sync S:Arch installed app icons
on:
  push:
    branches: [main]
    paths:
      - 'sarch-icon.svg'
      - '.github/workflows/sarch-icon-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Render matching PNG icons from the canonical SVG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 180 -h 180 sarch-icon.svg -o smetric-icon-180.png
          rsvg-convert -w 192 -h 192 sarch-icon.svg -o smetric-icon-192.png
          rsvg-convert -w 512 -h 512 sarch-icon.svg -o smetric-icon-512.png
      - name: Commit updated PWA and iPad icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smetric-icon-180.png smetric-icon-192.png smetric-icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Sync installed PWA icons with S:Arch logo [skip ci]"
            git push
          fi
