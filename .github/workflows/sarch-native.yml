name: SARCH v226 Android APK
on:
  push:
    branches: [native-app-v226]
    paths:
      - 'native-app/**'
      - '.github/workflows/sarch-native.yml'
  workflow_dispatch:
concurrency:
  group: sarch-native-brand-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  android:
    if: github.ref == 'refs/heads/native-app-v226'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare bundled web app and install dependencies
        run: |
          python -m pip install pillow
          python native-app/prepare.py
          cd native-app/build
          npm install --no-audit --no-fund
          npm run bundle
          npx cap add android
          python ../permissions.py android
          npx cap sync android
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s,n=re.subn(r'\bversionCode\s+\d+', 'versionCode 226',s,count=1)
          assert n == 1, 'versionCode not found'
          s,n=re.subn(r'\bversionName\s+[\"\'][^\"\']+[\"\']', 'versionName "1.0.226"',s,count=1)
          assert n == 1, 'versionName not found'
          p.write_text(s)
          PY
      - name: Build Android test APK
        working-directory: native-app/build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/native-app/artifacts"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/native-app/artifacts/SARCH-v226.apk"
      - name: Verify bundled APK startup paths and native camera
        run: |
          python - <<'PY'
          import zipfile,json
          p='native-app/artifacts/SARCH-v226.apk'
          with zipfile.ZipFile(p) as z:
              root='assets/public/'
              cfg=json.loads(z.read('assets/capacitor.config.json'))
              assert cfg['server']['appStartPath']=='/SEOB/index.html'
              assert cfg['server']['hostname']=='localhost'
              assert cfg['appId']=='com.sarch.fieldwork'
              home=z.read(root+'SEOB/index.html').decode()
              assert 'location.replace("/SEOB/index.html")' in z.read(root+'index.html').decode()
              for m in ('survey','drawing','schmidt','tilt'):
                  assert './'+m+'/index.html' in home, m
                  page=z.read(root+'SEOB/'+m+'/index.html').decode()
                  assert 'href="../index.html"' in page,m
                  assert '/native-bridge.js' in page,m
              bridge=z.read(root+'native-bridge.js').decode()
              assert 'saveToGallery' in bridge
              assert 'SARCHNativeRegisterWorker' in bridge
              print('APK startup path, four modules, native gallery bridge verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SARCH-v226-Android
          path: native-app/artifacts/SARCH-v226.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish standalone APK test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=sarch-v226-android-test
          file=native-app/artifacts/SARCH-v226.apk
          test -s "$file"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$file" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "S:ARCH v226 Android test" --notes "Android APK startup fix: direct bundled HTML paths, native gallery saving, retired Pokemon/Digimon/Marvel themes. Back up existing projects before installation. Debug signing may differ from earlier APK; native OTA is not implemented." --prerelease
          fi
