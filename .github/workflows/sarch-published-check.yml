# rerun: v194 authorized album folder writes without browser downloads
name: SARCH published-site verification
on:
  push:
    paths:
      - '.github/workflows/sarch-published-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check published GitHub Pages files (not local source)
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen, Request
          from datetime import datetime,timezone
          from pathlib import Path
          import json, time, os
          pages='https://smssimson.github.io/SEOB/'
          result={'checkedAtUTC':datetime.now(timezone.utc).isoformat(),'gitCommit':os.environ.get('GITHUB_SHA'),'url':pages}
          for i in range(14):
              try:
                  with urlopen(Request(pages+'version.json?sarch-check='+str(i),headers={'Cache-Control':'no-cache'}),timeout=15) as res:
                      raw=res.read()
                      result['publishedVersion']=json.loads(raw.decode('utf-8')).get('version')
                      result['versionHTTP']=res.status
                  with urlopen(Request(pages+'survey/index.html?sarch-check='+str(i),headers={'Cache-Control':'no-cache'}),timeout=15) as res:
                      html=res.read().decode('utf-8')
                      result['surveyHTTP']=res.status
                      result['interior12Slots']=('id="frontInsideCount">0 / 12장' in html and 'albumInteriorExtra' in html)
                      result['automaticPriceFallback']=('function sm185CompleteCost' in html and '자동추정 단가' in html)
                      result['defectXlsx187']=('sarch-defect-status-v157.js?v=187' in html and 'countEAExplicit' in html)
                      result['safeCostExportLinked']=('sarch-repair-exceljs-v190.js?v=192' in html and 'SARCHRepairExcelJSV190.download(' in html)
                      result['independentMergedSides']=('SM177_SIDES.includes(link.d.linkLabelSide)' in html and "const source=state.defects.find(x=>x.id===action.sourceId)" in html)
                      result['fieldFeatures']=('sm192GroupBar' in html and 'sm192RenderMarks' in html and 'sm192AllPng' in html and 'sm192OpenLength' in html and 'sm192OriginalPhoto' in html)
                      result['gridSelectors']=('function sm193InstallFields()' in html and "sm193OpenMenu('lengthPreset',true)" in html)
                      result['albumFolderWrite']=('function sm194WriteOriginals(files)' in html and 'window.showDirectoryPicker(' in html and 'await writer.write(f)' in html)
                      result['quietCapture']=('Camera capture does not trigger an automatic browser download' in html)
                      result['strictTenthsPicker']=('crack?Array.from({length:20}' in html and "!(crack&&cfg.preset==='widthPreset')" in html)
                  with urlopen(Request(pages+'sarch-repair-exceljs-v190.js?v=192',headers={'Cache-Control':'no-cache'}),timeout=15) as res:
                      xlsxjs=res.read().decode('utf-8')
                      result['costModuleHTTP']=res.status
                      result['costXmlSanitizer']=('const safeText=v=>Array.from(' in xlsxjs and 'await workbook.xlsx.writeBuffer()' in xlsxjs)
                      result['xlsxSchemaOrder']=('new ExcelJS.Workbook()' in xlsxjs and 'await verify.xlsx.load(bytes)' in xlsxjs and 'actualRowCount' in xlsxjs)
                      result['damageSummary']=('결함별 참고금액' in xlsxjs and "const VERSION='192'" in xlsxjs)
                  with urlopen(Request(pages+'survey/vendor/exceljs.min.js?v=190',headers={'Cache-Control':'no-cache'}),timeout=15) as res:
                      result['vendorHTTP']=res.status
                      result['vendorSize']=len(res.read())
                      result['offlineWriterReady']=(result['vendorHTTP']==200 and result['vendorSize']>500000)
                  result['publishedCurrent']=result.get('publishedVersion')==194 and result.get('interior12Slots') and result.get('automaticPriceFallback') and result.get('defectXlsx187') and result.get('independentMergedSides') and result.get('strictTenthsPicker') and result.get('safeCostExportLinked') and result.get('costXmlSanitizer') and result.get('xlsxSchemaOrder') and result.get('offlineWriterReady') and result.get('damageSummary') and result.get('fieldFeatures') and result.get('gridSelectors') and result.get('quietCapture') and result.get('albumFolderWrite')
                  if result['publishedCurrent']: break
              except Exception as error:
                  result['error']=str(error)
              time.sleep(8)
          Path('tools/sarch-live-status.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(result)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/sarch-live-status.json
          git commit -m 'ci: record published SARCH Pages verification [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
