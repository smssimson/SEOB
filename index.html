
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEOB 건축 업무 자동화 시스템</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      text-align: center;
      margin: 0;
      padding: 60px 20px;
      color: #172b49;
    }
    h1 { margin-bottom: 8px; }
    p { color: #64748b; }
    .container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 45px;
    }
    .card {
      width: 260px;
      padding: 35px 20px;
      background: white;
      border-radius: 16px;
      text-decoration: none;
      color: #172b49;
      box-shadow: 0 4px 18px #00000012;
      transition: transform .2s;
    }
    .card:hover { transform: translateY(-5px); }
    .icon { font-size: 48px; }
    .card h2 { font-size: 20px; }
    .card span { color: #64748b; font-size: 14px; }
  </style>
</head>
<body>
  <h1>SEOB</h1>
  <p>건축 업무 자동화 통합 시스템</p>

  <div class="container">
    <a class="card" href="./survey/">
      <div class="icon">📋</div>
      <h2>현장조사 프로그램</h2>
      <span>시특법 안전점검 · v27</span>
    </a>

    <a class="card" href="./drawing/">
      <div class="icon">📐</div>
      <h2>도면 작성 프로그램</h2>
      <span>건축 실측 도면 · v1</span>
    </a>
  </div>
</body>
</html>
