 function show(msg){let el=document.getElementById('sarchUpdateStatus');if(!el){el=document.createElement('div');el.id='sarchUpdateStatus';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=msg;clearTimeout(show.timer);show.timer=setTimeout(()=>el.remove(),5000)}
 async function update(manual){
  if(busy||!navigator.onLine){if(manual)show('인터넷 연결을 확인해 주세요.');return}busy=true;btn.disabled=true;
  if(manual)show('최신 파일 확인 중…');
  try{
   const ver=await fetch('./version.json?check='+Date.now(),{cache:'no-store'});if(!ver.ok)throw Error('버전 정보를 확인할 수 없습니다.');
   const v=await ver.json();
   if('serviceWorker' in navigator){
    const regs=await navigator.serviceWorker.getRegistrations();
    await Promise.allSettled(regs.filter(r=>new URL(r.scope).pathname.startsWith('/SEOB/')).map(r=>r.update()));
   }
   const key='sarch-home-loaded-version',old=Number(sessionStorage.getItem(key)||0),latest=Number(v.version)||0;
   if(manual){
    sessionStorage.setItem(key,String(latest));
    show('업데이트 확인 완료 · 최신 화면을 불러옵니다.');
    setTimeout(()=>location.reload(),250);
   }else if(old&&latest>old){show('새 버전이 배포되었습니다. 메인 화면을 갱신합니다.');sessionStorage.setItem(key,String(latest));setTimeout(()=>location.reload(),400)}
   else sessionStorage.setItem(key,String(latest));
  }catch(e){if(manual)show('확인 실패: '+e.message)}finally{busy=false;btn.disabled=false}
 }
 btn.addEventListener('click',()=>update(true));
 window.addEventListener('online',()=>update(false));
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)update(false)});
 window.addEventListener('load',()=>setTimeout(()=>update(false),1200));
 setInterval(()=>{if(!document.hidden)update(false)},60000);
})();</script><script defer src="./sarch-home-v139.js?v=139"></script><script defer src="./sarch-splash-v141.js?v=141"></script></body></html>
