<style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;margin:0;background:#f2f5fb;color:#112c4d;min-height:100vh}main{max-width:780px;margin:0 auto;padding:clamp(46px,10vh,95px) 20px 70px;text-align:center}h1{font-size:32px;margin:0 0 10px;font-weight:800;letter-spacing:.4px}.sub{color:#667e9a;margin:0;font-size:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:46px auto 0;max-width:625px}.card{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;min-height:205px;padding:28px 14px;background:#fff;border-radius:18px;box-shadow:0 7px 22px rgba(27,47,78,.08);text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}.card:focus-visible{outline:3px solid #1c71ce;outline-offset:4px}.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(27,47,78,.12)}.emoji{font-size:47px;line-height:1.1}.name{font-size:19px;font-weight:750}@media(max-width:520px){main{padding-top:64px}.grid{gap:12px;margin-top:34px}.card{min-height:180px;padding:18px 7px;gap:18px}.name{font-size:16px}.emoji{font-size:42px}}@media(max-width:360px){.grid{grid-template-columns:1fr}.card{min-height:145px}}</style></head>
