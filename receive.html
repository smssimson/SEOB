<!doctype html>
<html class="sarch-native-brand" data-module="receive" lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#20252b">
<link rel="manifest" href="./manifest.webmanifest">
<title>S:ARCH · 받은 현장 추가</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eef3f8;color:#17304a;font:14px Dotum,'돋움',Arial,sans-serif}
header{background:#102d4e;color:white;padding:18px 23px;font-weight:bold;font-size:19px}
main{max-width:660px;margin:30px auto;padding:0 16px}
.card{border:1px solid #cbd9e7;background:white;border-radius:15px;padding:23px;box-shadow:0 9px 30px #152f4d12}
h1{font-size:23px;margin:0 0 12px}p{line-height:1.8;margin:9px 0}#status{white-space:pre-wrap;background:#edf5fc;border-radius:10px;padding:13px;line-height:1.7;overflow-wrap:anywhere}
.details{background:#f6f9fc;border:1px solid #dde8f2;border-radius:9px;margin:16px 0;padding:13px;line-height:1.9;word-break:break-all}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}
button,a.button{background:#226fba;color:white;border:1px solid #226fba;border-radius:9px;padding:12px 15px;text-decoration:none;font:inherit;cursor:pointer}
button.secondary,a.secondary{background:white;color:#284767;border-color:#b6c9da}button:disabled{opacity:.55;cursor:not-allowed}
small{display:block;margin-top:14px;color:#536e87;line-height:1.7}
</style>
</head>
<body>
<header>S:ARCH · 현장 업무 플랫폼</header>
<main><section class="card">
<h1>받은 현장 추가</h1>
<p>기기에서 전달받은 프로젝트를 확인한 후 새 현장으로 추가합니다. 기존 현장과 도면·사진·조사자료는 유지됩니다.</p>
<div id="status" role="status">Quick Share로 받은 프로젝트 파일을 선택해 주세요.</div>
<div id="details" class="details" hidden></div>
<div class="actions">
<button id="pickBtn" type="button">받은 프로젝트 파일 선택</button>
<input id="filePick" type="file" accept=".json,.txt,.pdf,application/json,text/plain,application/pdf" hidden>
<button id="importBtn" disabled>새 현장으로 추가</button>
<button id="saveBtn" class="secondary" disabled>JSON 파일 저장</button>
<button id="deleteBtn" class="secondary" disabled>수신 파일 삭제</button>
<a class="button secondary" href="./">홈으로</a>
</div>
<small>안전 안내: 받은 파일은 기기 안의 임시 수신함에만 보관됩니다. 내용 확인 및 새 현장 추가를 승인하기 전에는 기존 작업을 변경하지 않습니다. 다른 형식의 파일은 자동으로 열지 않습니다.</small>
</section></main>
<script src="./sarch-transfer-v156.js?v=156"></script>
<script>
(function(){
"use strict";
const CACHE="sarch-share-inbox-v1";
const el=id=>document.getElementById(id);
const q=new URL(location.href).searchParams;
let id=q.get("id");
let file=null,type=null,cache=null;
const valid=()=>/^[a-f0-9-]{24,64}$/i.test(id||"");
function status(s){el("status").textContent=s}
function classify(o){
 if(o&&Array.isArray(o.defects)&&typeof o.nextId==="number")return {key:"survey",title:"현장조사",count:o.defects.length,unit:"결함"};
 if(o&&o.site&&Array.isArray(o.site.pages)&&Array.isArray(o.site.marks))return {key:"schmidt",title:"장비조사",count:o.site.marks.length,unit:"조사"};
 if(o&&Array.isArray(o.sites)&&o.sites.length&&o.sites.every(s=>Array.isArray(s.sheets)&&s.sheets.every(sh=>Array.isArray(sh.points))))return {key:"tilt",title:"기울기",count:o.sites.length,unit:"현장"};
 if(o&&(Array.isArray(o.sheets)&&o.sheets.length||Array.isArray(o.paths)||Array.isArray(o.pts)))return {key:"drawing",title:"도면작성",count:o.sheets?.length||1,unit:"도면"};
 return null;
}
async function run(){
 if(!valid()){
  status("Quick Share로 받은 .sarch.pdf 전송 파일 또는 기존 .json 백업 파일을 선택해 주세요. 기존 현장은 그대로 유지됩니다.");
  return
 }
 if(!("caches" in window)){status("이 브라우저는 수신 파일 보관함을 지원하지 않습니다.");return}
 try{
  cache=await caches.open(CACHE);
  const response=await cache.match(new URL("./inbox/"+id,location.href));
  if(!response){status("수신된 파일을 찾지 못했습니다. S:ARCH를 다시 실행하거나 파일을 다시 공유해 주세요.");return}
  let blob=await response.blob();
  if(blob.size>300*1024*1024)throw Error("파일 크기가 300MB를 초과합니다.");
  const receivedName=decodeURIComponent(response.headers.get("X-SARCH-Filename")||"받은현장.json");
  let filename=receivedName;
  if(/\.sarch\.pdf$/i.test(receivedName)){
   if(!window.SARCHTransferV156)throw Error("PDF 전송 파일 기능을 불러오지 못했습니다.");
   file=await window.SARCHTransferV156.jsonFromPdf(new File([blob],receivedName,{type:"application/pdf"}));
   blob=file;filename=file.name;
  }else file=new File([blob],filename,{type:"application/json"});
  const data=JSON.parse(await blob.text());
  type=classify(data);
  if(!type)throw Error("S:ARCH의 4개 프로젝트 형식과 일치하지 않습니다.");
  el("details").hidden=false;
  el("details").textContent="프로그램: "+type.title+"\n파일: "+filename+"\n포함 자료: "+type.unit+" "+type.count+"개\n용량: "+(blob.size/1024/1024).toFixed(2)+" MB";
  el("details").style.whiteSpace="pre-line";
  status("프로젝트 형식을 확인했습니다. '새 현장으로 추가'를 누르면 "+type.title+"에서 불러오기 확인창이 열립니다.");
  el("importBtn").disabled=false;el("saveBtn").disabled=false;el("deleteBtn").disabled=false;
 }catch(err){status("프로젝트 확인 실패: "+(err&&err.message||"파일을 다시 확인해 주세요."));el("deleteBtn").disabled=false}
}
el("pickBtn").onclick=()=>el("filePick").click();
el("filePick").addEventListener("change",async()=>{
 const chosen=el("filePick").files?.[0];
 if(!chosen)return;
 el("filePick").value="";
 el("pickBtn").disabled=true;
 try{
  if(!/\.(?:json|txt|pdf)$/i.test(chosen.name))throw Error("S:ARCH 프로젝트(.sarch.pdf, .json, .sarch.txt)를 선택해 주세요.");
  if(!chosen.size||chosen.size>300*1024*1024)throw Error("파일 용량이 비어 있거나 300MB를 초과합니다.");
  const decoded=/\.sarch\.pdf$/i.test(chosen.name)?
   await window.SARCHTransferV156.jsonFromPdf(chosen):chosen;
  const obj=JSON.parse(await decoded.text());
  if(!classify(obj))throw Error("S:ARCH 프로젝트 파일 형식이 아닙니다.");
  if(!("caches" in window))throw Error("브라우저 수신 저장소를 사용할 수 없습니다.");
  const token=crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,"0")).join("");
  const name=decoded.name.slice(0,160);
  const inbox=await caches.open(CACHE);
  await inbox.put(new URL("./inbox/"+token,location.href),new Response(decoded,{headers:{
   "Content-Type":"application/octet-stream",
   "X-SARCH-Filename":encodeURIComponent(name)
  }}));
  id=token;
  const url=new URL(location.href);url.searchParams.set("id",id);
  history.replaceState(null,"",url.pathname+url.search);
  await run();
 }catch(err){status("파일 선택 실패: "+(err?.message||"파일을 확인해 주세요."))}
 finally{el("pickBtn").disabled=false}
});
el("importBtn").onclick=()=>{if(type&&valid())location.href="./"+type.key+"/?sarch_received="+encodeURIComponent(id)};
el("saveBtn").onclick=()=>{if(!file)return;const url=URL.createObjectURL(file),a=document.createElement("a");a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)};
el("deleteBtn").onclick=async()=>{if(!valid()||!confirm("수신함에 보관된 파일만 삭제합니다. 기존 S:ARCH 현장에는 영향이 없습니다. 삭제할까요?"))return;const c=cache||await caches.open(CACHE);await c.delete(new URL("./inbox/"+id,location.href));status("수신 파일을 삭제했습니다.");el("importBtn").disabled=true;el("saveBtn").disabled=true;el("deleteBtn").disabled=true;el("details").hidden=true};
run();
})();
</script>
<link rel="stylesheet" href="./sarch-brand-v196.css"><link rel="stylesheet" href="./sarch-fandom-v198.css"><link rel="stylesheet" href="./sarch-global-theme-v200.css"><script defer src="./sarch-global-theme-v200.js"></script></body></html>
