<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMETRIC 현장조사 저장자료 보호</title><style>body{font:16px/1.6 sans-serif;background:#102033;color:white;padding:20px;max-width:720px;margin:auto}button,a{display:inline-block;background:#2678b8;color:white;border:0;border-radius:9px;padding:13px;margin:8px 0;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#213348;padding:14px}small{color:#cad9e5}</style><h1>현장조사 긴급 백업</h1><p>이 화면은 기존 현장자료를 수정하거나 삭제하지 않습니다. 저장된 자료를 파일로 내보내는 용도입니다.</p><button id="export">기기 저장자료 전체 백업(JSON)</button><p id="status">버튼을 눌러 백업하세요.</p><a href="./index.html?v=74">현장조사 다시 열기</a><p><small>백업파일에는 조사 내용·사진 등 민감한 현장정보가 포함될 수 있으므로 안전하게 보관하세요. 다른 기기에서는 기존 자료가 보이지 않을 수 있습니다.</small></p><script>document.getElementById('export').onclick=async()=>{let data={format:'smetric-local-recovery-v74',created:new Date().toISOString(),origin:location.origin,localStorage:{},indexedDB:[]},errors=[];try{for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);data.localStorage[k]=localStorage.getItem(k)}}catch(e){errors.push('localStorage: '+e.message)}try{if(indexedDB.databases){let dbs=await indexedDB.databases();for(let d of dbs){if(!d.name)continue;try{let db=await new Promise((resolve,reject)=>{let r=indexedDB.open(d.name);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});let result={name:d.name,version:db.version,stores:{}};for(let store of Array.from(db.objectStoreNames)){try{let tx=db.transaction(store,'readonly');let req=tx.objectStore(store).getAll();result.stores[store]=await new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}catch(e){errors.push(store+': '+e.message)}}db.close();data.indexedDB.push(result)}catch(e){errors.push(d.name+': '+e.message)}}}}catch(e){errors.push('indexedDB: '+e.message)}data.errors=errors;let json;try{json=JSON.stringify(data)}catch(e){document.getElementById('status').textContent='파일 생성 오류: '+e.message;return}let blob=new Blob([json],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SMETRIC_survey_recovery_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);document.getElementById('status').textContent='백업 파일 생성 완료 ('+Math.round(blob.size/1024)+'KB). 다운로드 폴더를 확인하세요.'};</script></html>
