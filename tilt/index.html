<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>SMETRIC · 기울기</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(135deg,#edf5fa,#f8fafc);font-family:Dotum,'돋움',Arial,sans-serif;color:#19354c;display:grid;place-items:center;padding:24px}.panel{max-width:520px;width:100%;background:#fff;border-radius:24px;padding:40px;box-shadow:0 20px 60px #173d5b15;text-align:center}.icon{margin:0 auto 18px;width:74px;height:74px;border-radius:20px;background:#e8f3f9;display:grid;place-items:center;color:#247d96}.icon svg{width:45px;height:45px}h1{font-size:30px;margin:0 0 14px}p{line-height:1.8;color:#6b8190}.status{display:inline-block;border-radius:30px;background:#edf4fa;color:#4b758f;padding:8px 17px;font-size:13px;margin:8px 0 22px}a{display:inline-block;padding:13px 24px;border-radius:12px;background:#163d5c;color:white;text-decoration:none}</style><style id="smetric-unified-header-css">

@media(max-width:620px){header.smetric-app-header{padding:9px!important}.smetric-head-controls{gap:6px}.smetric-head-controls label{font-size:11px}.smetric-home{padding:8px 10px!important}.smetric-head-controls select{max-width:115px}}
</style><style id="smetric-shared-theme-v14">
/* SMETRIC single palette, shared by all four modules. */
body[data-theme="light"]{--sm-bg:#edf3f9;--sm-panel:#ffffff;--sm-panel2:#f4f7fc;--sm-text:#162b43;--sm-muted:#52677e;--sm-line:#d0dce9;--sm-button:#f7faff;--sm-accent:#2677c9;--sm-field:#ffffff;--sm-head:#102941}
body[data-theme="dark"]{--sm-bg:#101a2a;--sm-panel:#19283b;--sm-panel2:#20334a;--sm-text:#e8f0fa;--sm-muted:#acbfd3;--sm-line:#354b63;--sm-button:#253950;--sm-accent:#60a5fa;--sm-field:#142238;--sm-head:#0b1828}
body[data-theme="navy"]{--sm-bg:#0c2440;--sm-panel:#143352;--sm-panel2:#1b4163;--sm-text:#eaf5ff;--sm-muted:#b2d0e8;--sm-line:#35607f;--sm-button:#224c70;--sm-accent:#67c3f5;--sm-field:#102d4c;--sm-head:#081c34}
body[data-theme="slate"]{--sm-bg:#262d38;--sm-panel:#343e4c;--sm-panel2:#3d4858;--sm-text:#f0f2f7;--sm-muted:#c3cbd7;--sm-line:#566273;--sm-button:#465365;--sm-accent:#a5b8d7;--sm-field:#303947;--sm-head:#202631}
body[data-theme]{background:var(--sm-bg)!important;color:var(--sm-text)!important;color-scheme:normal!important;--panel:var(--sm-panel);--panel2:var(--sm-panel2);--text:var(--sm-text);--muted:var(--sm-muted);--line:var(--sm-line);--bg:var(--sm-bg)}
body[data-theme] header.smetric-app-header{background:var(--sm-head)!important;border-color:var(--sm-line)!important;color:#fff!important}
body[data-theme] .panel,body[data-theme] .side,body[data-theme] aside,body[data-theme] .toolbar,body[data-theme] .site-manager,body[data-theme] .projectbar,body[data-theme] .groupTitle,body[data-theme] .entry,body[data-theme] .modal-content,body[data-theme] .modal .box{background:var(--sm-panel)!important;color:var(--sm-text)!important;border-color:var(--sm-line)!important}
body[data-theme] .tools .group,body[data-theme] .entry .head,body[data-theme] .group-items,body[data-theme] .status,body[data-theme] .pill{background:var(--sm-panel2)!important;color:var(--sm-text)!important;border-color:var(--sm-line)!important}
body[data-theme] button:not(.primary):not(.danger):not(.active):not(.smetric-home),body[data-theme] input:not([type="checkbox"]):not([type="radio"]):not([type="color"]):not([type="range"]):not([type="file"]),body[data-theme] select:not(.smetric-head-controls select),body[data-theme] textarea{background:var(--sm-field)!important;color:var(--sm-text)!important;border-color:var(--sm-line)!important}
body[data-theme] .hint,body[data-theme] .muted,body[data-theme] .help,body[data-theme] .side label,body[data-theme] footer{color:var(--sm-muted)!important}
body[data-theme] .canvasWrap,body[data-theme] .board,body[data-theme] .canvas-wrap{border-color:var(--sm-line)!important}
body[data-theme] .smetric-head-controls select{background:#20374f!important;color:#fff!important;border-color:#60758c!important}
body[data-theme] .smetric-head-controls label{color:#f0f6ff!important}
body[data-theme] .smetric-home{background:#fff!important;color:#14304b!important}
body[data-theme] .smetric-brand{font-family:Dotum,'돋움',Arial,sans-serif!important}
</style><style id="smetric-layout-v15">
.smetric-sitebar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;padding:13px 15px;margin:12px 0;background:var(--sm-panel,#19283b)!important;border:1px solid var(--sm-line,#354b63);border-radius:12px;color:var(--sm-text,#e8f0fa);font-family:Dotum,'돋움',Arial,sans-serif;box-sizing:border-box}
.smetric-sitebar .site-title{font-weight:700;font-size:13px;white-space:nowrap;margin-right:10px}
.smetric-sitebar select{flex:1;min-width:160px;max-width:none;width:auto;height:37px;background:var(--sm-field,#142238);color:var(--sm-text,#e8f0fa);border:1px solid var(--sm-line,#354b63);border-radius:8px;padding:0 10px}
.smetric-sitebar button{height:37px;min-width:0;white-space:nowrap;border:1px solid var(--sm-line,#354b63);border-radius:8px;background:var(--sm-button,#253950);color:var(--sm-text,#e8f0fa);padding:0 12px;cursor:pointer;font-family:inherit;font-size:13px}
.smetric-sitebar button.site-add{background:#3388df;color:white;border-color:#3388df}
.smetric-sitebar button.site-remove{border-color:#c97580;color:#ff8c99;background:transparent}
.smetric-sitebar button:focus-visible,.smetric-sitebar select:focus-visible{outline:2px solid var(--sm-accent,#60a5fa);outline-offset:2px}
.smetric-sitebar .site-count{font-size:11px;opacity:.72;white-space:nowrap}
.smetric-subbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 12px;margin:0 0 10px;border:1px solid var(--sm-line,#354b63);border-radius:10px;background:var(--sm-panel,#19283b)}
.smetric-subbar strong{font-size:12px;margin-right:4px}
.smetric-subbar button,.smetric-subbar select{height:35px;min-width:0;border-radius:7px}
@media(max-width:680px){.smetric-sitebar .site-title{width:100%}.smetric-sitebar select{flex-basis:100%}.smetric-sitebar button{flex:1}.smetric-sitebar .site-count{width:100%;text-align:right}}
</style></head><body><header class="smetric-app-header"><strong class="smetric-brand">SMETRIC · 기울기</strong><div class="smetric-head-controls"><a class="smetric-home" href="../" title="SMETRIC 메인 화면으로 이동">⌂ 홈</a><label for="tiltTheme">화면 테마 <select id="tiltTheme" aria-label="화면 테마"><option value="light">라이트</option><option value="dark">다크</option><option value="navy">네이비</option><option value="slate">슬레이트</option></select></label></div></header><div class="smetric-sitebar" id="tiltSiteBar"><span class="site-title">작업 현장 선택</span><select id="tiltSiteSelect"></select><button class="site-add" id="tiltNewSite">＋ 새 현장</button><button id="tiltRenameSite">현장 이름 변경</button><button class="site-remove" id="tiltDeleteSite">현장 삭제</button><span id="tiltSiteCount" class="site-count"></span></div><main class="panel"><div class="icon"><svg viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 51h40M18 47V18h29v29M18 47l29-29M25 36a12 12 0 0 1 12-12M27 47v-6m12 6v-6"/></svg></div><h1>기울기</h1><span class="status">신규 모듈 · 준비 중</span><p>건축물 기울기 측정 및 결과 비교<br>측정 기능은 추후 업데이트될 예정입니다.<br>현재는 측정하거나 결과를 저장할 수 없습니다.</p><a href="../">← SMETRIC 홈으로</a></main><script>(function(){const e=document.getElementById('tiltTheme');if(!e)return;e.value=localStorage.getItem('smetric-tilt-theme')||'dark';e.addEventListener('change',()=>{localStorage.setItem('smetric-tilt-theme',e.value);document.body.style.background=e.value==='light'?'#eef4fa':'#0c1422';document.body.style.color=e.value==='light'?'#19324e':'#f1f6fd'});e.dispatchEvent(new Event('change'));})();</script><script id="smetric-shared-theme-controller-v14">
(function(){
 const select=document.querySelector('.smetric-app-header .smetric-head-controls select');
 if(!select)return;
 const key='smetric-shared-theme-v14';
 const allowed=['light','dark','navy','slate'];
 let stored;try{stored=localStorage.getItem(key)}catch(e){}
 const initial=allowed.includes(stored)?stored:'dark';
 // All modules use the exact same four labels and one persistent preference.
 select.innerHTML='<option value="light">라이트</option><option value="dark">다크</option><option value="navy">네이비</option><option value="slate">슬레이트</option>';
 function apply(value){
  const v=allowed.includes(value)?value:'dark';
  document.body.dataset.theme=v;
  select.value=v;
  try{localStorage.setItem(key,v)}catch(e){}
 }
 // Use capture to stop legacy module-specific theme handlers from diverging.
 select.addEventListener('change',function(event){event.stopImmediatePropagation();apply(select.value)},true);
 apply(initial);
 window.addEventListener('storage',function(event){if(event.key===key&&allowed.includes(event.newValue))apply(event.newValue)});
})();
</script><script id="smetric-tilt-sites-v15">(function(){const key='smetric-tilt-sites-v15';let sites;try{sites=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}if(!sites||!Array.isArray(sites.list)||!sites.list.length)sites={list:[{id:'site-1',name:'새 현장',data:{}}],active:'site-1'};const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(sites))}function refresh(){$('tiltSiteSelect').innerHTML='';sites.list.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;$('tiltSiteSelect').appendChild(o)});$('tiltSiteSelect').value=sites.active;$('tiltSiteCount').textContent=sites.list.length+'개 현장';save()}$('tiltSiteSelect').onchange=e=>{sites.active=e.target.value;refresh()};$('tiltNewSite').onclick=()=>{let name=prompt('새 현장 이름','새 현장 '+(sites.list.length+1));if(name===null)return;let site={id:'site-'+Date.now(),name:name.trim()||'새 현장',data:{}};sites.list.push(site);sites.active=site.id;refresh()};$('tiltRenameSite').onclick=()=>{let site=sites.list.find(s=>s.id===sites.active);let name=prompt('현장 이름 변경',site.name);if(name&&name.trim()){site.name=name.trim();refresh()}};$('tiltDeleteSite').onclick=()=>{if(sites.list.length===1)return alert('마지막 현장은 삭제할 수 없습니다.');if(!confirm('현재 현장을 삭제할까요?'))return;sites.list=sites.list.filter(s=>s.id!==sites.active);sites.active=sites.list[0].id;refresh()};refresh()})();</script></body></html>
