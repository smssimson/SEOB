</head><body><header class="smetric-app-header"><strong class="smetric-brand">SMETRIC · 기울기</strong><div class="smetric-head-controls"><a class="smetric-home" href="../" title="SMETRIC 메인 화면으로 이동">⌂ 홈</a><label for="tiltTheme">화면 테마 <select id="tiltTheme" aria-label="화면 테마"><option value="light">라이트</option><option value="dark">다크</option><option value="navy">네이비</option><option value="slate">슬레이트</option></select></label></div></header><section class="smetric-quality" aria-label="자료 점검 및 백업"><strong>자료 점검</strong><span class="quality-result" id="qualityResult" role="status">현재 현장의 자료를 점검할 수 있습니다.</span><button type="button" id="qualityCheck">누락 점검</button><button type="button" id="qualityExport">점검 결과 CSV</button></section><div class="smetric-sitebar" id="tiltSiteBar"><span class="site-title">작업 현장 선택</span><select id="tiltSiteSelect"></select><button class="site-add" id="tiltNewSite">＋ 새 현장</button><button id="tiltRenameSite">현장 이름 변경</button><button class="site-remove" id="tiltDeleteSite">현장 삭제</button><span id="tiltSiteCount" class="site-count"></span></div><main class="panel"><div class="icon"><svg viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 51h40M18 47V18h29v29M18 47l29-29M25 36a12 12 0 0 1 12-12M27 47v-6m12 6v-6"/></svg></div><h1>기울기</h1><span class="status">신규 모듈 · 준비 중</span><p>건축물 기울기 측정 및 결과 비교<br>측정 기능은 추후 업데이트될 예정입니다.<br>현재는 측정하거나 결과를 저장할 수 없습니다.</p><a href="../">← SMETRIC 홈으로</a></main><script>(function(){const e=document.getElementById('tiltTheme');if(!e)return;e.value=localStorage.getItem('smetric-tilt-theme')||'dark';e.addEventListener('change',()=>{localStorage.setItem('smetric-tilt-theme',e.value);document.body.style.background=e.value==='light'?'#eef4fa':'#0c1422';document.body.style.color=e.value==='light'?'#19324e':'#f1f6fd'});e.dispatchEvent(new Event('change'));})();</script><script id="smetric-shared-theme-controller-v14">
(function(){
 const select=document.querySelector('.smetric-app-header .smetric-head-controls select');
 if(!select)return;
 const key='smetric-shared-theme-v14';
 const allowed=['light','dark','navy','slate'];
 let stored;try{stored=localStorage.getItem(key)}catch(e){}
 const initial=allowed.includes(stored)?stored:'dark';
 // All modules use the exact same four labels and one persistent preference.
 select.innerHTML='<option value="light">라이트</option><option value="dark">다크</option><option value="navy">네이비</option><option value="slate">슬레이트</option>';
 function apply(value){
  const v=allowed.includes(value)?value:'dark';
  document.body.dataset.theme=v;
  select.value=v;
  try{localStorage.setItem(key,v)}catch(e){}
 }
 // Use capture to stop legacy module-specific theme handlers from diverging.
 select.addEventListener('change',function(event){event.stopImmediatePropagation();apply(select.value)},true);
 apply(initial);
 window.addEventListener('storage',function(event){if(event.key===key&&allowed.includes(event.newValue))apply(event.newValue)});
})();
</script><script id="smetric-tilt-sites-v15">(function(){const key='smetric-tilt-sites-v15';let sites;try{sites=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}if(!sites||!Array.isArray(sites.list)||!sites.list.length)sites={list:[{id:'site-1',name:'새 현장',data:{}}],active:'site-1'};const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(sites))}function refresh(){$('tiltSiteSelect').innerHTML='';sites.list.forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name;$('tiltSiteSelect').appendChild(o)});$('tiltSiteSelect').value=sites.active;$('tiltSiteCount').textContent=sites.list.length+'개 현장';save()}$('tiltSiteSelect').onchange=e=>{sites.active=e.target.value;refresh()};$('tiltNewSite').onclick=()=>{let name=prompt('새 현장 이름','새 현장 '+(sites.list.length+1));if(name===null)return;let site={id:'site-'+Date.now(),name:name.trim()||'새 현장',data:{}};sites.list.push(site);sites.active=site.id;refresh()};$('tiltRenameSite').onclick=()=>{let site=sites.list.find(s=>s.id===sites.active);let name=prompt('현장 이름 변경',site.name);if(name&&name.trim()){site.name=name.trim();refresh()}};$('tiltDeleteSite').onclick=()=>{if(sites.list.length===1)return alert('마지막 현장은 삭제할 수 없습니다.');if(!confirm('현재 현장을 삭제할까요?'))return;sites.list=sites.list.filter(s=>s.id!==sites.active);sites.active=sites.list[0].id;refresh()};refresh()})();</script><script id="smetric-quality-tilt-v16">(function(){let r=document.getElementById('qualityResult');r.textContent='기울기 측정·판정 기능 준비 중 · 현재는 현장 목록만 관리합니다.';document.getElementById('qualityCheck').onclick=()=>alert('기울기 측정 데이터 점검 기능은 개발 예정입니다.');document.getElementById('qualityExport').disabled=true;document.getElementById('qualityExport').title='측정 기능 개발 후 제공';})();</script><script id="smetric-v17-layout">
(function(){
function apply(){

 card('작업 현장 선택',site);

 // 기존 이벤트 핸들러가 연결된 요소를 이동하므로 작업 데이터와 기능은 유지합니다.
}

})();
